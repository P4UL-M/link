[package]
name = "client-node"
version = "0.1.0"
edition = "2024"
default-run = "client-node"

[lib]
name = "client_node"
path = "src/lib.rs"

[[bin]]
name = "client-node"
path = "src/main.rs"

[[bin]]
name = "client-node-test"
path = "src/test.rs"

[dependencies]
uuid = { version = "1.17.0", features = ["v4", "serde"] }
rand = { version = "0.8.5", features = ["std"] }
tokio = { version = "1", features = ["full"] }
crossterm = "0.29.0"
ratatui = "0.29.0"
indexmap = "2.9.0"
futures = "0.3.31"
tokio-util = "0.7.15"
serde = { version = "1.0.219", features = ["derive"] }
bincode = "1.3.3"
rsa = "0.9.8"
aes = "0.8.4"
ctr = "0.9.2"
